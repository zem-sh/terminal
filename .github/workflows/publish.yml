name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC). Provenance is generated
  # automatically when publishing this way.
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}"
            exit 1
          fi
          echo "Publishing @zem-sh/terminal@${package_version}"

      - name: Pack check
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN: npm detects the GitHub Actions OIDC environment and
      # exchanges its identity token for a short-lived credential. This trusted
      # publisher allows `npm stage publish` only, so the release is staged and
      # a maintainer approves it with 2FA on npmjs.com to make it live.
      - name: Stage release on npm
        run: npm stage publish --provenance --access public

      - name: Summarize
        run: |
          {
            echo "### Staged @zem-sh/terminal@$(node -p "require('./package.json').version")"
            echo
            echo "Approve it with 2FA at https://www.npmjs.com/package/@zem-sh/terminal"
            echo "(Staged Packages tab), or run \`npm stage list\` / \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
